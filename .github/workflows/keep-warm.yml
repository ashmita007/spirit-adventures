# Render's free plan sleeps the service after 15 idle minutes, and the next
# visitor waits ~50 s for it to wake. Pinging the health check every 10 minutes
# keeps it warm (one free service running 24/7 fits in the 750 free hours/month).
name: Keep Render warm

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping health check and home page
        run: |
          curl -fsS --max-time 90 -o /dev/null -w "health %{http_code} %{time_total}s\n" https://spirit-adventures-ksg2.onrender.com/api/v1/health/ || true
          curl -fsS --max-time 90 -o /dev/null -w "home %{http_code} %{time_total}s\n" https://spirit-adventures-ksg2.onrender.com/ || true
