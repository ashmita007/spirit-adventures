services:
  # ====================================================
  # Spirit Adventures - Complete Unified 1-Service Deploy
  # Runs Next.js Website + Django API together on Free Tier
  # ====================================================
  - type: web
    name: spirit-adventures
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    envVars:
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: "*"
      - key: WHATSAPP_NUMBER
        value: "+919666567551"
      - key: SUPPORT_EMAIL
        value: "hello@spiritadventures.in"
      - key: SUPPORT_PHONE
        value: "+91 96665 67551"
