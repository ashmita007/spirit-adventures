services:
  db:
    image: postgres:16-alpine
    container_name: spirit_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: spirit_adventures
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: spirit_backend
    restart: unless-stopped
    command: >
      sh -c "python manage.py migrate &&
             python manage.py seed_data &&
             python manage.py runserver 0.0.0.0:8000"
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    environment:
      - DEBUG=True
      - SECRET_KEY=spirit-adventures-dev-secret-key-nature-2025-cinematic
      - POSTGRES_DB=spirit_adventures
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgrespassword
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - WHATSAPP_NUMBER=+919876543210
      - SUPPORT_EMAIL=hello@spiritadventures.in
      - SUPPORT_PHONE=+91 98765 43210
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: spirit_frontend
    restart: unless-stopped
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api/v1
      - NEXT_PUBLIC_WHATSAPP_NUMBER=+919876543210
      - NEXT_PUBLIC_PHONE_NUMBER=+91 98765 43210
      - NEXT_PUBLIC_EMAIL=hello@spiritadventures.in
    depends_on:
      - backend

volumes:
  postgres_data:
